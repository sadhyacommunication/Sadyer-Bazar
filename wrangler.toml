# =============================================================================
# Sadhyer Bazar (সাধ্যের বাজার) — Cloudflare Workers + Static Assets Configuration
#
# Build command  : npm run build
# Deploy command : npx wrangler deploy
# Static assets  : ./out               (Next.js static export)
# Edge API Worker: functions/worker.ts (routes /api/* through functions/api/*)
#
# Secrets (set in Cloudflare Dashboard -> Settings -> Variables and Secrets,
# or via `npx wrangler secret put <NAME>`):
#   - SUPABASE_SERVICE_ROLE_KEY
#   - TURNSTILE_SECRET_KEY
#   - BKASH_APP_KEY, BKASH_APP_SECRET, BKASH_USERNAME, BKASH_PASSWORD
#   - NAGAD_MERCHANT_ID, NAGAD_PUBLIC_KEY, NAGAD_PRIVATE_KEY
# =============================================================================
name = "sadyer-bazar"
main = "functions/worker.ts"
compatibility_date = "2025-09-27"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./out"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[vars]
APP_ENV = "production"
PAYMENT_MODE = "live"
NEXT_PUBLIC_SITE_URL = "https://sadhyerbazar.com"
NEXT_PUBLIC_SUPABASE_URL = "https://uqyjtlndgnvfqjcdwbop.supabase.co"
IP_HASH_SALT = "sb-prod-edge-rate-limit-salt-v2-2026"
